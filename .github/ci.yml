name: CI

# Build and test segments of the AI-image-detection solution on every push / PR.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:        # allows manual runs from the Actions tab

jobs:
  build:
    name: Build (compile all sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Byte-compile every tracked Python file
        # Fails the job on any syntax error in the codebase
        # (model.py, dataset.py, train.py, evaluate.py, gui.py, Utilities/...).
        run: |
          python -m pip install --upgrade pip
          python -m compileall -q $(git ls-files '*.py')

  test:
    name: Test (data pipeline + model)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU-only)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "timm>=1.0.3" "albumentations>=1.4.0,<2.0" \
                      "opencv-python-headless>=4.8.0" "pytest>=7.4"

      - name: Run unit tests
        run: pytest
